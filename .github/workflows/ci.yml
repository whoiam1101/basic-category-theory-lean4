name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security & Signed Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for hardcoded secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Signed Commits
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::group::Verifying commits in Pull Request #${{ github.event.pull_request.number }}"
            COMMITS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits")

            FAILED=0
            while read -r sha verified reason message; do
              if [ "$verified" != "true" ]; then
                echo "::error::Commit $sha is unsigned or unverified (reason: $reason) -> $message"
                FAILED=1
              else
                echo "✓ Commit $sha verified ($reason) -> $message"
              fi
            done < <(echo "$COMMITS" | jq -r '.[] | "\(.sha[0:7]) \(.commit.verification.verified) \(.commit.verification.reason) \(.commit.message | split("\n")[0])"')

            echo "::endgroup::"
            if [ "$FAILED" -ne 0 ]; then
              echo "Error: One or more commits in this PR are not signed/verified."
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "::group::Verifying push commit ${{ github.sha }}"
            RES=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}")

            VERIFIED=$(echo "$RES" | jq -r '.commit.verification.verified')
            REASON=$(echo "$RES" | jq -r '.commit.verification.reason')

            if [ "$VERIFIED" != "true" ]; then
              echo "::error::Push commit ${{ github.sha }} is not verified by GitHub (reason: $REASON)."
              echo "::endgroup::"
              exit 1
            fi
            echo "✓ Push commit ${{ github.sha }} is verified ($REASON)"
            echo "::endgroup::"
          else
            echo "Workflow event '${{ github.event_name }}': skipping commit signature verification."
          fi

  lint-and-quality:
    name: Code Quality & Proof Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for sorry/admit in Lean files
        run: |
          echo "Checking for 'sorry' and 'admit' in Lean code..."
          if grep -rnE '\b(sorry|admit)\b' --include="*.lean" --exclude-dir=".claude/scratch" --exclude-dir=".lake" .; then
            echo "::error::Found unfinished proofs ('sorry'/'admit') in Lean files. All proofs must be fully formalized."
            exit 1
          else
            echo "✓ No 'sorry' or 'admit' found."
          fi

      - name: Check for banned heavy tactics
        run: |
          echo "Checking for banned heavy tactics (aesop, grind, omega)..."
          if grep -rnE '\b(aesop|grind|omega)\b' --include="*.lean" --exclude-dir=".claude/scratch" --exclude-dir=".lake" .; then
            echo "::error::Found banned heavy tactics (aesop, grind, omega). Proofs must use standard tactics (see AGENTS.md)."
            exit 1
          else
            echo "✓ No banned heavy tactics found."
          fi

      - name: Check whitespace and syntax (pre-commit)
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

      - name: Verify README statistics are up to date
        run: |
          python3 scripts/update_readme_stats.py --check

  build:
    name: Build Lean Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build with Lean Action
        uses: leanprover/lean-action@v1
